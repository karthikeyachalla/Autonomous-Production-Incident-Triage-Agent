version: '3.8'

services:
  api:
    build: .
    container_name: triage_agent_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    command: python main.py

  ui:
    build: .
    container_name: triage_agent_ui
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
